[build-system]
requires = ["scikit-build-core>=0.5.0", "pybind11>=2.11.1", "numpy>=1.20"]
build-backend = "scikit_build_core.build"

[project]
name = "massconsistent-amr"
version = "0.1.1"
description = "Mass-consistent 3D wind solver with AMReX"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "hgopalan" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "netcdf4>=1.5.7",
    "h5py>=3.0",
    "requests>=2.25",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
all = [
    "floris>=3.0",
    "py-wake>=2.1",
    "pandas>=1.3.0",
    "xarray>=0.20.0",
    "dask[complete]>=2022.0",
    "seaborn>=0.11.0",
    "scikit-learn>=1.0.0",
    "plotly>=5.0",
    "bokeh>=2.4",
]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
cmake.define = { "MASSCONSISTENT_BUILD_PYTHON_BINDINGS" = "ON" }
